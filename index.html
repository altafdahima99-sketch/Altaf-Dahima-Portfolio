    <style>
        :root {
            --primary-yellow: #FFD700;
            --accent-blue: #007BFF;
            --dark-bg: #09090b;
            --card-bg: #18181b;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
        }

        .btn-primary {
            background-color: var(--primary-yellow);
            color: black;
            font-weight: 700;
            padding: 0.75rem 2rem;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.875rem;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary:hover { background-color: #facc15; transform: scale(1.05); }

        .btn-outline {
            background-color: transparent;
            color: var(--primary-yellow);
            font-weight: 700;
            padding: 0.75rem 2rem;
            border: 1px solid var(--primary-yellow);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.875rem;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            font-family: 'Inter', sans-serif;
        }
        .btn-outline:hover { background-color: var(--primary-yellow); color: black; transform: scale(1.05); }

        .section-padding { padding: 6rem 1.5rem; }
        @media (min-width: 768px) { .section-padding { padding: 6rem 3rem; } }
        @media (min-width: 1024px) { .section-padding { padding: 6rem 6rem; } }

        .section-title {
            font-size: clamp(2rem, 5vw, 3.75rem);
            font-weight: 700;
            margin-bottom: 1rem;
            position: relative;
            display: inline-block;
        }
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -0.5rem;
            left: 0;
            width: 33%;
            height: 4px;
            background-color: var(--primary-yellow);
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0) translateX(-50%); } 50% { transform: translateY(-10px) translateX(-50%); } }
        @keyframes revealUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes revealLeft { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes revealRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }

        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-zoom-in { animation: zoomIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-bounce-custom { animation: bounce 2s ease-in-out infinite; }

        /* Cursor */
        #custom-cursor { position: fixed; inset: 0; pointer-events: none; z-index: 9999; mix-blend-mode: difference; display: none; }
        @media (min-width: 768px) { #custom-cursor { display: block; } }
        .cursor-dot { position: absolute; width: 8px; height: 8px; background: var(--primary-yellow); border-radius: 50%; transform: translate(-50%, -50%); transition: opacity 0.3s; }
        .cursor-ring { position: absolute; border-radius: 50%; border: 1px solid var(--primary-yellow); transform: translate(-50%, -50%); transition: all 0.3s ease-out; }

        /* Navbar */
        nav { position: fixed; width: 100%; z-index: 50; transition: all 0.3s; padding: 1.5rem 0; }
        nav.scrolled { background-color: rgba(9,9,11,0.95); backdrop-filter: blur(4px); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 1rem 0; }
        .nav-link { font-size: 0.75rem; font-weight: 500; color: #fff; text-decoration: none; text-transform: uppercase; letter-spacing: 0.1em; transition: color 0.3s; font-family: 'Inter', sans-serif; }

        /* Portfolio */
        .portfolio-item { position: relative; overflow: hidden; cursor: pointer; break-inside: avoid; margin-bottom: 1.5rem; }
        .portfolio-item img { width: 100%; height: auto; object-fit: contain; transition: transform 0.7s; display: block; }
        .portfolio-item:hover img { transform: scale(1.1); }
        .portfolio-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.4), transparent); display: flex; flex-direction: column; justify-content: flex-end; padding: 1.5rem; transition: all 0.3s; }
        .portfolio-expand { position: absolute; top: 1rem; right: 1rem; background: var(--primary-yellow); border-radius: 50%; padding: 0.5rem; opacity: 0; transform: translateY(8px); transition: all 0.3s; }
        .portfolio-item:hover .portfolio-expand { opacity: 1; transform: translateY(0); }
        .filter-btn { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; padding: 0.5rem 0.75rem; border: 1px solid rgba(255,255,255,0.1); color: #9ca3af; background: transparent; cursor: pointer; transition: all 0.3s; font-family: 'Inter', sans-serif; }
        .filter-btn:hover { color: white; border-color: white; }
        .filter-btn.active { background: var(--primary-yellow); color: black; border-color: var(--primary-yellow); }

        /* Lightbox */
        .lightbox { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.95); backdrop-filter: blur(4px); padding: 1rem; }
        .lightbox-inner { position: relative; width: 100%; max-width: 72rem; max-height: 90vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* Mobile menu */
        .mobile-menu { position: absolute; top: 100%; left: 0; width: 100%; background: var(--dark-bg); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }

        /* Reveal on scroll */
        .reveal { opacity: 0; transition: opacity 0.6s ease, transform 0.6s ease; }
        .reveal.revealed { opacity: 1; transform: none !important; }
        .reveal-up { transform: translateY(40px); }
        .reveal-left { transform: translateX(-40px); }
        .reveal-right { transform: translateX(40px); }

        /* Contact form */
        .contact-input { width: 100%; background: #121212; border: 1px solid rgba(255,255,255,0.1); padding: 1rem; color: white; outline: none; transition: border-color 0.3s; font-family: 'Inter', sans-serif; font-size: 1rem; }
        .contact-input:focus { border-color: var(--primary-yellow); }
        .contact-input::placeholder { color: #4b5563; }

        /* Education */
        .edu-card { background: var(--card-bg); padding: 2rem; border-left: 4px solid var(--primary-yellow); transition: all 0.3s; }
        .edu-card:hover { transform: translateX(8px); }

        /* Footer */
        footer a { text-decoration: none; }

        /* Columns layout */
        .masonry { column-count: 1; column-gap: 1.5rem; }
        @media (min-width: 640px) { .masonry { column-count: 2; } }
        @media (min-width: 1024px) { .masonry { column-count: 3; } }

        /* Social */
        .social-btn { width: 2.5rem; height: 2.5rem; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; transition: all 0.3s; text-decoration: none; color: white; }
        .social-btn:hover { background: var(--primary-yellow); border-color: var(--primary-yellow); color: black; }

        /* Icon fallbacks using CSS shapes */
        .icon { display: inline-flex; align-items: center; justify-content: center; }

        /* Print */
        @media print {
            @page { margin: 1cm; size: A4; }
            body { background: white !important; color: black !important; }
            nav, button, #custom-cursor { display: none !important; }
            section { background: white !important; padding: 1.5rem 0 !important; }
            h1, h2, h3 { color: black !important; }
            p, li, span, div { color: #333 !important; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--dark-bg); }
        ::-webkit-scrollbar-thumb { background: var(--primary-yellow); border-radius: 2px; }

        /* SVG Icons */
        svg { display: inline-block; vertical-align: middle; }
    </style>
</head>

// ── REVEAL COMPONENT ───────────────────────────────────────────────────────────
function Reveal({ children, direction = 'up', delay = 0, className = '' }) {
    const ref = React.useRef(null);
    const [visible, setVisible] = React.useState(false);

    React.useEffect(() => {
        const observer = new IntersectionObserver(
            ([entry]) => { if (entry.isIntersecting) { setVisible(true); observer.disconnect(); } },
            { threshold: 0.1 }
        );
        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
    }, []);

    const dirClass = direction === 'left' ? 'reveal-left' : direction === 'right' ? 'reveal-right' : 'reveal-up';

    return (
        <div
            ref={ref}
            className={`reveal ${dirClass} ${visible ? 'revealed' : ''} ${className}`}
            style={{ transitionDelay: visible ? `${delay}ms` : '0ms' }}
        >
            {children}
        </div>
    );
}

// ── CUSTOM CURSOR ──────────────────────────────────────────────────────────────
function CustomCursor() {
    const [mouse, setMouse] = React.useState({ x: 0, y: 0 });
    const [follower, setFollower] = React.useState({ x: 0, y: 0 });
    const [hovering, setHovering] = React.useState(false);
    const mouseRef = React.useRef({ x: 0, y: 0 });

    React.useEffect(() => {
        const onMove = (e) => {
            mouseRef.current = { x: e.clientX, y: e.clientY };
            setMouse({ x: e.clientX, y: e.clientY });
        };
        const onOver = (e) => {
            setHovering(!!e.target.closest('a, button, input, textarea, [data-hover]'));
        };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseover', onOver);
        return () => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseover', onOver); };
    }, []);

    React.useEffect(() => {
        let id;
        const animate = () => {
            setFollower(prev => ({
                x: prev.x + (mouseRef.current.x - prev.x) * 0.15,
                y: prev.y + (mouseRef.current.y - prev.y) * 0.15
            }));
            id = requestAnimationFrame(animate);
        };
        animate();
        return () => cancelAnimationFrame(id);
    }, []);

    return (
        <div id="custom-cursor">
            <div className="cursor-dot" style={{ left: mouse.x, top: mouse.y, opacity: hovering ? 0 : 1 }} />
            <div className="cursor-ring" style={{
                left: follower.x, top: follower.y,
                width: hovering ? 64 : 32, height: hovering ? 64 : 32,
                opacity: hovering ? 0.4 : 0.6,
                backgroundColor: hovering ? 'var(--primary-yellow)' : 'transparent',
                mixBlendMode: hovering ? 'normal' : undefined
            }} />
        </div>
    );
}

// ── NAVBAR ─────────────────────────────────────────────────────────────────────
function Navbar() {
    const [open, setOpen] = React.useState(false);
    const [scrolled, setScrolled] = React.useState(false);

    React.useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 50);
        window.addEventListener('scroll', onScroll);
        return () => window.removeEventListener('scroll', onScroll);
    }, []);

    const links = [
        { name: 'About', href: '#about' },
        { name: 'Skills', href: '#skills' },
        { name: 'Portfolio', href: '#portfolio' },
        { name: 'Education', href: '#education' },
        { name: 'Contact', href: '#contact' },
    ];

    return (
        <nav className={scrolled ? 'scrolled' : ''} style={{ position: 'fixed', top: 0, width: '100%', zIndex: 50 }}>
            <div style={{ maxWidth: '1280px', margin: '0 auto', padding: '0 1.5rem', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <a href="#" style={{ fontSize: '1.25rem', fontWeight: 700, letterSpacing: '-0.05em', color: 'white', textDecoration: 'none', fontFamily: 'Oswald, sans-serif' }}>
                    ALTAF<span style={{ color: 'var(--primary-yellow)' }}>.</span>DAHIMA
                </a>

                {/* Desktop */}
                <div style={{ display: 'none', alignItems: 'center', gap: '2rem' }} className="desktop-nav">
                    {links.map(l => <a key={l.name} href={l.href} className="nav-link">{l.name}</a>)}
                    <button onClick={() => window.print()} style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', border: '1px solid var(--primary-yellow)', color: 'var(--primary-yellow)', padding: '0.625rem 1.25rem', fontSize: '0.7rem', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.1em', background: 'transparent', cursor: 'pointer', transition: 'all 0.3s', fontFamily: 'Inter, sans-serif' }}
                        onMouseEnter={e => { e.target.style.background = 'var(--primary-yellow)'; e.target.style.color = 'black'; }}
                        onMouseLeave={e => { e.target.style.background = 'transparent'; e.target.style.color = 'var(--primary-yellow)'; }}>
                        <Icon name="file-down" size={16} /> Save as PDF
                    </button>
                </div>

                {/* Mobile toggle */}
                <button onClick={() => setOpen(!open)} style={{ background: 'none', border: 'none', color: 'white', cursor: 'pointer' }} className="mobile-toggle">
                    <Icon name={open ? 'x' : 'menu'} size={24} />
                </button>
            </div>

            {open && (
                <div className="mobile-menu">
                    {links.map(l => (

// ── APP ────────────────────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
    constructor(props) { super(props); this.state = { hasError: false }; }
    static getDerivedStateFromError() { return { hasError: true }; }
    componentDidCatch(error, info) { console.error(error, info); }
    render() {
        if (this.state.hasError) return (
            <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#09090b', color: 'white', textAlign: 'center' }}>
                <div>
                    <h1 style={{ fontSize: '1.5rem', marginBottom: '1rem' }}>Something went wrong</h1>
                    <button onClick={() => window.location.reload()} style={{ padding: '0.5rem 1.5rem', background: 'var(--primary-yellow)', color: 'black', border: 'none', cursor: 'pointer', fontWeight: 700 }}>Reload</button>
                </div>
            </div>
        );
        return this.props.children;
    }
}

    return (
        <div style={{ minHeight: '100vh', background: 'var(--dark-bg)' }}>

            <Navbar />
            <Hero />
            <About />
            <Skills />
            <Portfolio />
            <Education />
            <Contact />
            <Footer />
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App /></ErrorBoundary>);
