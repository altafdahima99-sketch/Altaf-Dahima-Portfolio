    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-yellow: #FFD700;
            --accent-blue: #007BFF;
            --dark-bg: #09090b;
            --card-bg: #18181b;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }
    }

    @layer base {
        body {
            @apply bg-[var(--dark-bg)] text-[var(--text-main)] font-sans antialiased;
            font-family: 'Inter', sans-serif;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
        }
    }

    @layer components {
        .btn-primary {
            @apply bg-[var(--primary-yellow)] text-black font-bold px-8 py-3 rounded-none hover:bg-yellow-400 transition-all duration-300 uppercase tracking-wider text-sm;
        }
        .btn-outline {
            @apply border border-[var(--primary-yellow)] text-[var(--primary-yellow)] font-bold px-8 py-3 rounded-none hover:bg-[var(--primary-yellow)] hover:text-black transition-all duration-300 uppercase tracking-wider text-sm;
        }
        .section-padding {
            @apply py-24 px-6 md:px-12 lg:px-24;
        }
        .section-title {
            @apply text-4xl md:text-6xl font-bold mb-4 relative inline-block;
        }
        .section-title::after {
            content: '';
            @apply absolute -bottom-2 left-0 w-1/3 h-1 bg-[var(--primary-yellow)];
        }
    }
    
    @layer utilities {
        @media print {
            @page {
                margin: 0;
                size: A4;
            }
            body {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                background-color: #09090b !important;
                color: white !important;
                width: 100%;
            }
            
            /* Hide interactive and navigation elements */
            nav, button, .btn-primary, .btn-outline, .no-print, .icon-arrow-down {
                display: none !important;
            }

            /* Layout adjustments */
            #root {
                width: 100%;
                overflow: visible;
            }

            section {
                break-inside: auto; /* Allow breaking for long sections */
                page-break-inside: auto;
                padding-top: 2rem !important;
                padding-bottom: 2rem !important;
                min-height: auto !important;
                overflow: visible !important;
            }

            /* Prevent breaking inside specific components */
            .print-break-avoid {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }

            /* Typography */
            h1, h2, h3, h4, h5, h6 {
                color: white !important;
                page-break-after: avoid;
            }
            p, li, span {
                color: #e4e4e7 !important; /* Zinc-200 */
            }
            .text-muted {
                color: #a1a1aa !important; /* Zinc-400 */
            }

            /* Hero adjustments for print - Cover Page */
            [data-name="hero"] {
                height: 100vh !important;
                min-height: 100vh !important;
                page-break-after: always;
                display: flex !important;
                align-items: center;
                justify-content: center;
                margin: 0 !important;
                padding: 0 !important;
            }
            [data-name="hero"] h1 {
                font-size: 5rem !important;
                color: black !important;
                -webkit-text-stroke: 2px black;
            }
            [data-name="hero"] p {
                color: black !important;
            }
            [data-name="hero"] .text-transparent {
                color: black !important;
                -webkit-text-fill-color: black !important;
            }
            
            /* Force breaks after major sections to start fresh */
            [data-name="portfolio"], 
            [data-name="education"] {
                page-break-before: always;
            }

            /* Ensure titles stick to their content */
            h2, h3, .section-title {
                break-after: avoid;
                page-break-after: avoid;
            }

            /* optimize spacing for print to fill pages better */
            .section-padding {
                padding-top: 2rem !important;
                padding-bottom: 2rem !important;
            }

            /* Hide forms in print */
            form {
                display: none !important;
            }
            
            /* Make grid items display properly */
            .grid {
                display: grid !important;
            }
            
            /* Ensure images print clearly */
            img {
                max-width: 100% !important;
                display: block;
            }
            
            /* Add a print footer to every page if supported, otherwise at end */
            @page {
                margin: 1.5cm;
            }
        }

        .text-stroke {
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2);
            color: transparent;
        }
        .text-stroke-hover:hover {
            -webkit-text-stroke: 0px;
            color: var(--primary-yellow);
        }

        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .animate-zoom-in {
            animation: zoomIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    }
    </style>
</head>

</body>
